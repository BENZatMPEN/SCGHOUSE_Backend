version: '3'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27117:27017"
    volumes:
      - ./data/mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ajbear1969
  api:
    image: production-anslysis-services
    ports:
      - "2300:2300"
  client:
    image: production-anslysis-dashboard
    ports:
      - "8000:3000"
    volumes:
      - .:/usr/src/app
    environment:
      REACT_APP_BACKEND_API_ENDPOINT: http://127.0.0.1:2333
    command: npm start
  